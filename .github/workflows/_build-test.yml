# Reusable template: managed build + tests + pack + package validation.
# Called by pr.yml (pull requests) and release.yml (main / tags).
#
# Runner paths (GitHub-hosted runner, checkout at workspace root):
#   ${{ github.workspace }}            = repo root (solution Freenaute.Freebox.slnx)
#   .artifacts/build/                  = bin + obj of every project (UseArtifactsOutput / ArtifactsPath)
#   .artifacts/nuget/                  = *.nupkg + *.snupkg candidates (PackageOutputPath)
#   .artifacts/test/                   = MTP test logs
name: build-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  managed-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked solution
        run: dotnet restore Freenaute.Freebox.slnx --locked-mode
      - name: Build release
        run: dotnet build Freenaute.Freebox.slnx -c Release --no-restore -warnaserror
      - name: Run MTP tests
        run: |
          mkdir -p .artifacts/test
          dotnet test --solution Freenaute.Freebox.slnx -c Release --no-build --no-restore 2>&1 | tee .artifacts/test/managed-tests.log
      # Single package: Freenaute.Freebox.Client (the Mapper assembly is embedded in it).
      - name: Pack client package
        run: dotnet pack Libs/Freenaute.Freebox.Client/Freenaute.Freebox.Client.csproj -c Release --no-build --no-restore -warnaserror
      - name: Validate package candidates
        shell: pwsh
        run: ./.github/scripts/Validate-Packages.ps1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: .artifacts/test
          if-no-files-found: warn
      - name: Upload NuGet candidates
        uses: actions/upload-artifact@v7
        with:
          name: nuget-candidates
          path: .artifacts/nuget
          if-no-files-found: error
