# Release CI/CD: on push to main or tag v*.*.* — build, test, AOT smoke (linux-x64 + win-x64),
# pack, then publish the NuGet packages to nuget.org via OIDC trusted publishing.
#
# Runner paths (GitHub-hosted runner, checkout at workspace root = ${{ github.workspace }}):
#   .artifacts/build/     bin + obj of all projects
#   .artifacts/test/      MTP test logs (artifact: test-results)
#   .artifacts/nuget/     *.nupkg + *.snupkg from `dotnet pack` (artifact: nuget-candidates)
#   .artifacts/aot/<rid>/ native smoke binaries (artifacts: aot-linux-x64, aot-win-x64)
#
# One-time manual setup on nuget.org (Trusted Publishing policy):
#   owner `AriusII`, repository `Freenaute-Freebox-Api`, workflow file `release.yml`,
#   environment `nuget-publish`. The OIDC token is exchanged for a short-lived NuGet API
#   key (~1 h) inside the publish job, so login and push must stay in the same job.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    uses: ./.github/workflows/_build-test.yml

  aot:
    uses: ./.github/workflows/_aot.yml

  publish-nuget:
    needs: [build-test, aot]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: nuget-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # Artifact `nuget-candidates` lands in .artifacts/nuget (PackageOutputPath of the repo).
      - name: Download NuGet candidates
        uses: actions/download-artifact@v8
        with:
          name: nuget-candidates
          path: .artifacts/nuget
      # OIDC trusted publishing: the job's OIDC token is exchanged for a short-lived
      # NuGet API key (~1h). No long-lived key is stored. The `id: login` is REQUIRED
      # so that steps.login.outputs.NUGET_API_KEY is populated.
      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, e.g. AriusII
      - name: Guard - API key must be issued
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::OIDC login did not issue an API key. Check: NUGET_USER secret exists, Trusted Publishing policy matches workflow 'release.yml' + environment 'nuget-publish', job has id-token: write."
            exit 1
          fi
          echo "Temporary API key issued (masked)."
      - name: Push packages and symbols (v3)
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push .artifacts/nuget/*.nupkg  --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push .artifacts/nuget/*.snupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
